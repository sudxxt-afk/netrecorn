[package]
name = "tracemap"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cyber-recon traceroute TUI: live route table, world map, ASN/geo enrichment"
license = "MIT"
repository = "https://github.com/sudxxt-afk/netrecorn"
keywords = ["traceroute", "tui", "ratatui", "network", "geoip"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
caracat = "1.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
dns-lookup = "4.0"
futures = "0.3"
rand = "0.9"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }

[profile.release]
lto = "thin"
strip = true
